[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge-native"
version = "1.1.0"
requires-python = ">=3.9"
description = "ClipForge native messaging launcher"

[project.scripts]
clipforge-native = "native_host:main"

[tool.setuptools]
py-modules = ["native_host"]
